project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - modules/*/index.qmd

website:
  title: "APAC Asset Pricing"
  site-url: "https://kyanite03.github.io/apac-asset-pricing/"
  repo-url: "https://github.com/kyanite03/apac-asset-pricing"
  repo-actions: [source]
  page-navigation: true
  navbar:
    left:
      - href: index.qmd
        text: Overview
      - text: Modules
        menu:
          - href: modules/01-capm-market-model/index.qmd
            text: "01 · CAPM and the market model"
          - href: modules/03-testing-pricing-models/index.qmd
            text: "03 · Testing pricing models"
          - href: modules/04-statistical-factors-apt/index.qmd
            text: "04 · Statistical factors (APT)"
          - href: modules/05-cross-market-asx-hk-sg/index.qmd
            text: "05 · Cross-market comparison"
          - href: modules/06-dcf-tencent/index.qmd
            text: "06 · Valuing Tencent (DCF)"
    right:
      - icon: github
        href: "https://github.com/kyanite03/apac-asset-pricing"
  page-footer:
    left: "© 2026 Kai Marsh · code MIT, text and figures all rights reserved"

format:
  html:
    theme: cosmo
    toc: true
    code-fold: true
    code-summary: "Show code"
    fig-dpi: 150

execute:
  freeze: auto
  warning: false
  message: false
